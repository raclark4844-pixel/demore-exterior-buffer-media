name: Decode Facebook graphics
on:
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 PNGs
        run: |
          set -euo pipefail
          if ls encoded/day*.png.b64 >/dev/null 2>&1; then
            mkdir -p week1
            for f in encoded/day*.png.b64; do
              out="week1/$(basename "${f%.b64}")"
              base64 -d "$f" > "$out"
              file "$out"
            done
          fi
          if ls encoded/week2/*.png.b64 >/dev/null 2>&1; then
            mkdir -p week2
            for f in encoded/week2/*.png.b64; do
              out="week2/$(basename "${f%.b64}")"
              base64 -d "$f" > "$out"
              file "$out"
            done
          fi
      - name: Commit PNG graphics
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add week1/*.png week2/*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No PNG changes to commit"
          else
            git commit -m "Add decoded Facebook graphics"
            git push
          fi
