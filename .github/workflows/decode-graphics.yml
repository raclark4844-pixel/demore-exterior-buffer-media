name: Decode Week 1 graphics
on:
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 PNGs into week1/
        run: |
          set -euo pipefail
          mkdir -p week1
          for f in encoded/day*.png.b64; do
            out="week1/$(basename "${f%.b64}")"
            base64 -d "$f" > "$out"
            file "$out"
          done
      - name: Commit PNG graphics
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add week1/*.png
          if git diff --cached --quiet; then
            echo "No PNG changes to commit"
          else
            git commit -m "Add decoded Week 1 Facebook graphics"
            git push
          fi
